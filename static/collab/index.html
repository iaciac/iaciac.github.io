// ─── Helpers ────────────────────────────────────────────────────────
var egoId = 0, egoNid = "a0";

function paperLink(p) {
  var label = p.url
    ? '<a href="' + p.url + '" target="_blank">' + p.title + '</a>'
    : p.title;
  return label;
}

function paperMeta(p) {
  return '<span class="meta">' + p.journal + ' &middot; ' + p.year + '</span>';
}

function paperItem(p) {
  return '<div class="paper-item">' + paperLink(p) + '<br>' + paperMeta(p) + '</div>';
}

// ─── Data processing ────────────────────────────────────────────────
var coauthorMap = {};
PAPERS.forEach(function(p) {
  p.authors.forEach(function(aid) {
    if (aid === egoId) return;
    if (!coauthorMap[aid]) coauthorMap[aid] = { count:0, papers:[] };
    coauthorMap[aid].count++;
    coauthorMap[aid].papers.push(p);
  });
});

function inferCluster(p) {
  var cnt = {};
  p.authors.forEach(function(aid) {
    if (aid === egoId) return;
    var a = AUTHORS.find(function(x) { return x.id === aid; });
    if (a && a.cluster !== 'ego') cnt[a.cluster] = (cnt[a.cluster] || 0) + 1;
  });
  var e = Object.entries(cnt);
  return e.length ? e.sort(function(a,b) { return b[1]-a[1]; })[0][0] : 'other';
}

var authorNodes = AUTHORS
  .filter(function(a) { return a.id === egoId || coauthorMap[a.id]; })
  .map(function(a) {
    return Object.assign({}, a, {
      type: 'author',
      nid: 'a' + a.id,
      count: a.id === egoId ? PAPERS.length : coauthorMap[a.id].count,
    });
  });

var paperNodes = PAPERS.map(function(p, i) {
  return {
    type:'paper', nid:'p'+i, pidx:i,
    title:p.title, year:p.year, journal:p.journal, authors:p.authors, url:p.url,
    cluster:inferCluster(p),
  };
});

var nodes = authorNodes.concat(paperNodes);
var byNid = {};
nodes.forEach(function(n) { byNid[n.nid] = n; });

var maxCount = d3.max(authorNodes.filter(function(n) { return n.id !== egoId; }), function(n) { return n.count; }) || 1;

function nodeColor(n) { return CLUSTERS[n.cluster].color; }
function nodeR(n) {
  if (n.nid === egoNid)   return 26;
  if (n.type === 'paper') return 7;
  return 6 + (n.count / maxCount) * 13;
}
function diamondPath(r) {
  return 'M 0,' + (-r) + ' L ' + (r*0.7) + ',0 L 0,' + r + ' L ' + (-r*0.7) + ',0 Z';
}

      rawLinks.push({ source:'p'+i, target:'a'+aid, lt:'pa' });
    }
  });
});
var links = rawLinks.map(function(l) { return Object.assign({}, l); });

// ─── Layout ─────────────────────────────────────────────────────────

var g = svg.append("g");

var zoom = d3.zoom().scaleExtent([0.2, 4]).on("zoom", function(e) { g.attr("transform", e.transform); });
svg.call(zoom);
svg.call(zoom.transform, d3.zoomIdentity.translate(W * 0.05, H * 0.05).scale(0.75));

var RING_R = Math.min(W, H) * 0.42;
var clusterKeys = ['contagion','innovation','urban','epidemio','other'];
var cCount = {};
clusterKeys.forEach(function(k) { cCount[k] = 0; });
authorNodes.forEach(function(n) { if (n.id !== egoId && cCount[n.cluster] !== undefined) cCount[n.cluster]++; });
var totalA = authorNodes.length - 1;
var a0 = -Math.PI / 2;
var cAngle = {};
clusterKeys.forEach(function(k) {
  cAngle[k] = a0 + (cCount[k] / totalA) * Math.PI;
  a0 += (cCount[k] / totalA) * 2 * Math.PI;
});
function centroid(k) {
  var key = cAngle[k] !== undefined ? k : 'other';
  return { x: W/2 + RING_R * Math.cos(cAngle[key]), y: H/2 + RING_R * Math.sin(cAngle[key]) };
}

nodes.forEach(function(n) {
  if (n.nid === egoNid) { n.x = W/2; n.y = H/2; return; }
  if (n.type === 'paper') {
    var ang = (n.pidx / PAPERS.length) * 2 * Math.PI;
    n.x = W/2 + 110 * Math.cos(ang) + (Math.random() - 0.5) * 30;
    n.y = H/2 + 110 * Math.sin(ang) + (Math.random() - 0.5) * 30;
  } else {
    var c = centroid(n.cluster);
    n.x = c.x + (Math.random() - 0.5) * 70;
    n.y = c.y + (Math.random() - 0.5) * 70;
  }
});

function clusterForce(alpha) {
  nodes.forEach(function(n) {
    if (n.type !== 'author' || n.nid === egoNid) return;
    var c = centroid(n.cluster);
    n.vx += (c.x - n.x) * 0.1 * alpha;
    n.vy += (c.y - n.y) * 0.1 * alpha;
  });
}

var sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(function(d) { return d.nid; })
    .distance(function(d) { return d.lt === 'ep' ? 120 : 65; })
    .strength(function(d) { return d.lt === 'ep' ? 0.06 : 0.55; }))
  .force("charge", d3.forceManyBody().strength(function(d) {
    if (d.nid === egoNid)   return -2000;
    if (d.type === 'paper') return -60;
    return -170;
  }))
  .force("cluster", clusterForce)
  .force("collision", d3.forceCollide(function(d) {
    if (d.nid === egoNid)   return 32;
    if (d.type === 'paper') return 16;
    return nodeR(d) + 26;
  }));

// ─── Drawing ────────────────────────────────────────────────────────
var linkSel = g.append("g").selectAll("line")
  .data(links).join("line")
  .attr("stroke-linecap", "round")
  .attr("stroke", function(d) {
    var t = byNid[d.target] || byNid[d.target.nid];
    return t ? nodeColor(t) : "#555";
  })
  .attr("stroke-opacity", function(d) { return d.lt === 'ep' ? 0.12 : 0.35; })
  .attr("stroke-width",   function(d) { return d.lt === 'ep' ? 1 : 1.5; })
  .attr("stroke-dasharray", function(d) { return d.lt === 'ep' ? '3,5' : null; });

var nodeSel = g.append("g").selectAll(".node")
  .data(nodes).join("g")
  .attr("class", function(d) { return "node " + d.type + (d.nid === egoNid ? " ego" : ""); })
  .call(d3.drag()
    .on("start", function(e,d) { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
    .on("drag",  function(e,d) { d.fx=e.x; d.fy=e.y; })
    .on("end",   function(e,d) { if (!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; })
  )
  .on("click", function(e,d) { showPanel(d); });

nodeSel.filter(function(d) { return d.type === 'author'; })
  .append("circle")
  .attr("r", nodeR)
  .attr("fill",   function(d) { return d3.color(nodeColor(d)).darker(d.nid === egoNid ? 0 : 1.6); })
  .attr("stroke", nodeColor)
  .attr("stroke-width", function(d) { return d.nid === egoNid ? 3 : 2; });

nodeSel.filter(function(d) { return d.type === 'paper'; })
  .append("path")
  .attr("d", function(d) { return diamondPath(nodeR(d)); })
  .attr("fill",   function(d) { return d3.color(nodeColor(d)).darker(2.2); })
  .attr("stroke", nodeColor)
  .attr("stroke-width", 1.5);

nodeSel.filter(function(d) { return d.type === 'author'; })
  .append("text")
  .attr("dy", function(d) { return nodeR(d) + 12; })
  .attr("text-anchor", "middle")
  .text(function(d) {
    return d.name.length > 18 ? d.name.slice(0, 17) + "..." : d.name;
  });

sim.on("tick", function() {
  var ego = nodes.find(function(n) { return n.nid === egoNid; });
  ego.fx = W/2; ego.fy = H/2;
  linkSel
    .attr("x1", function(d) { return d.source.x; }).attr("y1", function(d) { return d.source.y; })
    .attr("x2", function(d) { return d.target.x; }).attr("y2", function(d) { return d.target.y; });
  nodeSel.attr("transform", function(d) { return "translate(" + d.x + "," + d.y + ")"; });
});

// ─── Panel ──────────────────────────────────────────────────────────
function setBadge(cluster) {
  var cl = CLUSTERS[cluster], pb = document.getElementById("pb");
  pb.style.cssText = "display:inline-block;background:" + d3.color(cl.color).darker(1.5) + ";color:" + cl.color + ";border:1px solid " + cl.color;
  pb.textContent = cl.label;
}

function showPanel(d) {
  if (d.nid === egoNid) {
    document.getElementById("pt").textContent   = "I. Iacopini";
    document.getElementById("ps").textContent   = "Ego node · all papers";
    document.getElementById("pb").style.display = "none";
    document.getElementById("pc").textContent   = PAPERS.length;
    document.getElementById("pcl").textContent  = "publications";
    document.getElementById("pn").innerHTML = PAPERS.map(paperItem).join("");
  } else if (d.type === 'paper') {
    document.getElementById("pt").innerHTML    = paperLink(d);
    document.getElementById("ps").textContent  = d.journal + " · " + d.year + " · " + d.authors.length + " authors";
    setBadge(d.cluster);
    document.getElementById("pc").textContent  = d.authors.length;
    document.getElementById("pcl").textContent = "authors";
    document.getElementById("pn").innerHTML = d.authors.map(function(aid) {
      var a = AUTHORS.find(function(x) { return x.id === aid; });
      if (!a) return '';
      var col = CLUSTERS[a.cluster].color;
      var lbl = aid === egoId
        ? '<strong style="color:#e0eaff">I. Iacopini</strong>'
        : a.name;
      return '<div class="paper-item"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:' + col + ';margin-right:5px;vertical-align:middle"></span>' + lbl + '</div>';
    }).join("");
  } else {
    var data = coauthorMap[d.id];
    document.getElementById("pt").textContent  = d.name;
    document.getElementById("ps").textContent  = CLUSTERS[d.cluster].label;
    setBadge(d.cluster);
    document.getElementById("pc").textContent  = data.count;
    document.getElementById("pcl").textContent = "paper" + (data.count > 1 ? "s" : "") + " with I. Iacopini";
    document.getElementById("pn").innerHTML = data.papers.map(paperItem).join("");
  }

  var hi = new Set([egoNid]);
  if (d.nid === egoNid) {
    nodes.forEach(function(n) { hi.add(n.nid); });
  } else if (d.type === 'paper') {
    hi.add(d.nid);
    d.authors.forEach(function(aid) { hi.add('a' + aid); });
  } else {
    hi.add(d.nid);
    coauthorMap[d.id].papers.forEach(function(p) {
      hi.add('p' + PAPERS.indexOf(p));
      p.authors.forEach(function(aid) { hi.add('a' + aid); });
    });
  }

  nodeSel.attr("opacity", function(n) { return hi.has(n.nid) ? 1 : 0.1; });
  linkSel.attr("stroke-opacity", function(l) {
    var s = l.source.nid, t = l.target.nid;
    return (hi.has(s) && hi.has(t)) ? (l.lt === 'ep' ? 0.35 : 0.85) : 0.03;
  });
  document.getElementById("panel").classList.add("on");
}

document.getElementById("xbtn").addEventListener("click", function() {
  document.getElementById("panel").classList.remove("on");
  nodeSel.attr("opacity", 1);
  linkSel.attr("stroke-opacity", function(l) { return l.lt === 'ep' ? 0.12 : 0.35; });
});
</script>
</body>
</html>
