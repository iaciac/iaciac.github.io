<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Collaboration Network</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0e1a; font-family:'Segoe UI',sans-serif; color:#d0d8e8; overflow:hidden; }
  svg { width:100vw; height:100vh; }
  .node { cursor:pointer; }
  .node.author:hover circle { filter:brightness(1.5); }
  .node.paper:hover path   { filter:brightness(2); }
  .node.author text { font-size:10px; fill:#a8b4c8; pointer-events:none; }
  .node.ego    text { font-size:13px; font-weight:bold; fill:#fff; }

  #panel {
    position:fixed; top:20px; right:20px; width:280px;
    background:rgba(10,14,26,0.97);
    border:1px solid rgba(100,150,255,0.25);
    border-radius:10px; padding:18px;
    opacity:0; pointer-events:none; transition:opacity 0.25s;
    box-shadow:0 0 30px rgba(0,0,0,0.8);
    max-height:80vh; overflow-y:auto;
  }
  #panel.on { opacity:1; pointer-events:all; }
  #panel h2  { font-size:13px; color:#e0eaff; margin-bottom:3px; line-height:1.4; }
  .psub  { font-size:11px; color:#6080b0; margin-bottom:10px; }
  .pbadge { display:inline-block; font-size:10px; padding:2px 8px; border-radius:20px; margin-bottom:10px; }
  .pcount { font-size:22px; font-weight:bold; color:#7ab4ff; margin-bottom:2px; }
  .pcount-label { font-size:10px; color:#4060a0; margin-bottom:10px; }
  .paper-list { font-size:11px; }
  .paper-item { padding:5px 0; border-bottom:1px solid rgba(100,150,255,0.1); color:#8090b0; line-height:1.4; }
  .paper-item span { color:#5070b0; font-size:10px; }
  .x { position:absolute; top:10px; right:13px; cursor:pointer; color:#334; font-size:15px; }
  .x:hover { color:#7ab4ff; }

  #legend {
    position:fixed; bottom:20px; left:20px;
    background:rgba(10,14,26,0.92);
    border:1px solid rgba(100,150,255,0.15);
    border-radius:8px; padding:11px 15px; font-size:10px;
  }
  #legend h3 { font-size:10px; color:#5070a0; letter-spacing:1px; text-transform:uppercase; margin-bottom:7px; }
  .li { display:flex; align-items:center; gap:7px; margin-bottom:4px; }
  .ld { width:10px; height:10px; border-radius:50%; flex-shrink:0; }

  #hint { position:fixed; bottom:20px; right:20px; font-size:10px; color:#334; }
  #title-bar {
    position:fixed; top:20px; left:20px; font-size:12px; color:#5080c0; letter-spacing:1px;
    background:rgba(10,14,26,0.92); border:1px solid rgba(100,150,255,0.15);
    border-radius:8px; padding:8px 14px;
  }
  #title-bar a { color:#7ab4ff; text-decoration:none; }
  #title-bar a:hover { color:#aad4ff; text-decoration:underline; }
</style>
</head>
<body>

<svg id="cv"></svg>

<div id="title-bar">
  <a href="https://iaciac.github.io/" target="_blank">I. Iacopini</a> – Co-authorship Network
</div>

<div id="panel">
  <span class="x" id="xbtn">✕</span>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
const CLUSTERS = {

const AUTHORS = [

  { id:1,  name:"E. Valdano",         cluster:"epidemio"   },

  { id:82, name:"E. Blouzard",        cluster:"epidemio"   },
  { id:83, name:"P. Casanova",        cluster:"epidemio"   },
  { id:84, name:"S. Milojević",       cluster:"innovation" },
  { id:85, name:"J.-G. Young",        cluster:"contagion"  },
];

const PAPERS = [
  { title:"Discovering the laws behind complex networked systems",                                    year:2026, authors:[0,1] },
  { title:"Modeling the Spread of Misfolded Proteins in Alzheimer's Disease",                        year:2025, authors:[0,2,3,4,5] },
  { title:"Networks of ingredient combinations as culinary fingerprints of world cuisines",           year:2025, authors:[0,6,7,8,9,4] },
  { title:"Disentangling heterogeneity and hyperedge overlap in explosive contagion",                 year:2025, authors:[0,10,11,12] },
  { title:"Episcopal genealogy and ideology in the Roman Catholic Church",                            year:2025, authors:[0,13,14,15,16,17,18,19,20,1] },
  { title:"Distinguishing mechanisms of social contagion from local network view",                    year:2025, authors:[0,21,22,23] },
  { title:"The dynamics of higher-order novelties",                                                   year:2025, authors:[0,24,25,26,27,4] },
  { title:"Temporal dynamics of group interactions in higher-order social networks",                  year:2024, authors:[0,23,28] },
  { title:"Structural evolution of temporal hypergraphs through hyper-cores",                         year:2024, authors:[0,29,3,28] },
  { title:"Higher-order networks to study animal communication",                                      year:2024, authors:[0,30,31,32,33] },
  { title:"Insights from exact social contagion dynamics on higher-order structures",                 year:2023, authors:[0,12,34,35] },
  { title:"Hyper-cores promote localization and efficient seeding",                                   year:2023, authors:[0,29,3,28] },
  { title:"XGI: A Python package for higher-order interaction networks",                             year:2023, authors:[0,69,36,3,70,71,72] },
  { title:"Simplicially driven simple contagion",                                                    year:2023, authors:[0,36,37,28,3] },
  { title:"Quantifying human performance in chess",                                                  year:2023, authors:[0,38,8] },
  { title:"Non-selective distribution of infectious disease prevention",                             year:2022, authors:[0,39,40,41,42,19,1] },
  { title:"Social contagion on higher-order structures",                                             year:2022, authors:[0,28,43,44] },
  { title:"Group interactions modulate critical mass dynamics in social convention",                  year:2022, authors:[0,3,45,28] },
  { title:"Social interactions affect discovery processes",                                          year:2022, authors:[0,24,66,68,4,67] },
  { title:"Influential groups for seeding nonlinear contagion in hypergraphs",                       year:2022, authors:[0,46,4,28,3,47,48] },
  { title:"The physics of higher-order interactions in complex systems",                             year:2021, authors:[0,8,28,49,50,43,51,4,52,44,53,54,55,3] },
  { title:"Structural architecture of international industry networks",                              year:2021, authors:[0,56,57,58,59] },
  { title:"Simplicial contagion in temporal higher-order networks",                                  year:2021, authors:[0,38,60,61,8] },
  { title:"London in lockdown: Mobility in the Pandemic City",                                      year:2021, authors:[0,62,63,64,65] },
  { title:"On the dual nature of adoption processes in complex networks",                            year:2021, authors:[0,4] },
  { title:"Interactive discovery processes on complex networks",                                     year:2020, authors:[0,24,66,67,4] },
  { title:"Networks beyond pairwise interactions: structure and dynamics",                           year:2020, authors:[0,8,61,4,36,71,85,3] },
  { title:"Multilayer modeling of adoption dynamics in energy demand management",                    year:2020, authors:[0,73,74,75,4] },
  { title:"The brokerage role of small states in global corporate networks",                         year:2019, authors:[0,57,56,58] },
  { title:"Using Foursquare data to reveal spatial and temporal patterns in London",                 year:2019, authors:[0,64,76,63,77,78,65,74,62] },
  { title:"Creative Connectivity Project – group dynamics and creative performance",                 year:2019, authors:[0,79,80,4] },
  { title:"Evaluating the impact of PrEP on HIV and gonorrhea on a networked population",           year:2019, authors:[0,81,82,41,83,39,40,19,1] },
  { title:"Simplicial models of social contagion",                                                  year:2019, authors:[0,3,28,4] },
  { title:"Tax havens and offshore financial centres: an industry sector perspective",              year:2019, authors:[0,56,57,58] },
  { title:"Tax havens and offshore financial centers in Asia-Pacific networks",                     year:2018, authors:[0,57,56,58] },
  { title:"Network dynamics of innovation processes",                                               year:2018, authors:[0,84,4] },
];

// ─── Data processing ────────────────────────────────────────────────
const egoId = 0, egoNid = "a0";

const coauthorMap = {};
PAPERS.forEach(p => {
  p.authors.forEach(aid => {
    if (aid === egoId) return;
    if (!coauthorMap[aid]) coauthorMap[aid] = { count:0, papers:[] };
    coauthorMap[aid].count++;
    coauthorMap[aid].papers.push(p);
  });
});

function inferCluster(p) {
  const cnt = {};
  p.authors.forEach(aid => {
    if (aid === egoId) return;
    const a = AUTHORS.find(x => x.id === aid);
    if (a) cnt[a.cluster] = (cnt[a.cluster]||0) + 1;
  });
  const e = Object.entries(cnt);
  return e.length ? e.sort((a,b) => b[1]-a[1])[0][0] : 'other';
}

const authorNodes = AUTHORS
  .filter(a => a.id === egoId || coauthorMap[a.id])
  .map(a => ({
    ...a, type:'author', nid:`a${a.id}`,
    count: a.id===egoId ? PAPERS.length : coauthorMap[a.id].count,
  }));

const paperNodes = PAPERS.map((p,i) => ({
  type:'paper', nid:`p${i}`, pidx:i,
  title:p.title, year:p.year, authors:p.authors,
  cluster: inferCluster(p),
}));

const nodes = [...authorNodes, ...paperNodes];
const byNid = {};
nodes.forEach(n => byNid[n.nid] = n);

const maxCount = d3.max(authorNodes.filter(n => n.id !== egoId), n => n.count) || 1;
const nodeColor = n => CLUSTERS[n.cluster].color;
function nodeR(n) {
  if (n.nid === egoNid)   return 26;
  if (n.type === 'paper') return 7;
  return 6 + (n.count / maxCount) * 13;
}
const diamondPath = r => `M 0,${-r} L ${r*0.7},0 L 0,${r} L ${-r*0.7},0 Z`;

const rawLinks = [];
PAPERS.forEach((p,i) => {
  rawLinks.push({ source:egoNid, target:`p${i}`, lt:'ep' });
  p.authors.forEach(aid => {
    if (aid !== egoId && coauthorMap[aid])
      rawLinks.push({ source:`p${i}`, target:`a${aid}`, lt:'pa' });
  });
});
const links = rawLinks.map(l => ({...l}));

// ─── Layout ─────────────────────────────────────────────────────────
const W = innerWidth, H = innerHeight;
const svg = d3.select("#cv").attr("viewBox", `0 0 ${W} ${H}`);
const g = svg.append("g");
const zoom = d3.zoom().scaleExtent([0.2,4]).on("zoom", e => g.attr("transform", e.transform));
svg.call(zoom);
svg.call(zoom.transform, d3.zoomIdentity.translate(W * 0.05, H * 0.05).scale(0.75));

const RING_R = Math.min(W, H) * 0.42;
const clusterKeys = Object.keys(CLUSTERS);
const cCount = {};
clusterKeys.forEach(k => cCount[k] = 0);
authorNodes.forEach(n => { if (n.id !== egoId) cCount[n.cluster]++; });
const totalA = authorNodes.length - 1;
let a0 = -Math.PI / 2;
const cAngle = {};
clusterKeys.forEach(k => {
  cAngle[k] = a0 + (cCount[k] / totalA) * Math.PI;
  a0 += (cCount[k] / totalA) * 2 * Math.PI;
});
const centroid = k => ({
  x: W/2 + RING_R * Math.cos(cAngle[k]),
  y: H/2 + RING_R * Math.sin(cAngle[k]),
});

nodes.forEach(n => {
  if (n.nid === egoNid) { n.x = W/2; n.y = H/2; return; }
  if (n.type === 'paper') {
    const ang = (n.pidx / PAPERS.length) * 2 * Math.PI;
    n.x = W/2 + 110*Math.cos(ang) + (Math.random()-.5)*30;
    n.y = H/2 + 110*Math.sin(ang) + (Math.random()-.5)*30;
  } else {
    const c = centroid(n.cluster);
    n.x = c.x + (Math.random()-.5)*70;
    n.y = c.y + (Math.random()-.5)*70;
  }
});

function clusterForce(alpha) {
  nodes.forEach(n => {
    if (n.type !== 'author' || n.nid === egoNid) return;
    const c = centroid(n.cluster);
    n.vx += (c.x - n.x) * 0.1 * alpha;
    n.vy += (c.y - n.y) * 0.1 * alpha;
  });
}

const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.nid)
    .distance(d => d.lt==='ep' ? 120 : 65)
    .strength(d => d.lt==='ep' ? 0.06 : 0.55))
  .force("charge", d3.forceManyBody().strength(d => {
    if (d.nid === egoNid)   return -2000;
    if (d.type === 'paper') return -60;
    return -170;
  }))
  .force("cluster", clusterForce)
  .force("collision", d3.forceCollide(d => {
    if (d.nid === egoNid)   return 32;
    if (d.type === 'paper') return 16;
    return nodeR(d) + 26;
  }));

// ─── Drawing ────────────────────────────────────────────────────────
const linkSel = g.append("g").selectAll("line")
  .data(links).join("line")
  .attr("stroke-linecap", "round")
  .attr("stroke", d => nodeColor(byNid[d.target] || byNid[d.target.nid]))
  .attr("stroke-opacity", d => d.lt==='ep' ? 0.12 : 0.35)
  .attr("stroke-width",   d => d.lt==='ep' ? 1 : 1.5)
  .attr("stroke-dasharray", d => d.lt==='ep' ? '3,5' : null);

const nodeSel = g.append("g").selectAll(".node")
  .data(nodes).join("g")
  .attr("class", d => `node ${d.type}${d.nid===egoNid?' ego':''}`)
  .call(d3.drag()
    .on("start", (e,d) => { if(!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
    .on("drag",  (e,d) => { d.fx=e.x; d.fy=e.y; })
    .on("end",   (e,d) => { if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; })
  )
  .on("click", (e,d) => showPanel(d));

nodeSel.filter(d => d.type==='author')
  .append("circle")
  .attr("r", d => nodeR(d))
  .attr("fill",   d => d3.color(nodeColor(d)).darker(d.nid===egoNid ? 0 : 1.6))
  .attr("stroke", d => nodeColor(d))
  .attr("stroke-width", d => d.nid===egoNid ? 3 : 2);

nodeSel.filter(d => d.type==='paper')
  .append("path")
  .attr("d", d => diamondPath(nodeR(d)))
  .attr("fill",   d => d3.color(nodeColor(d)).darker(2.2))
  .attr("stroke", d => nodeColor(d))
  .attr("stroke-width", 1.5);

nodeSel.filter(d => d.type==='author')
  .append("text")
  .attr("dy", d => nodeR(d) + 12)
  .attr("text-anchor", "middle")
  .text(d => {
    const nm = d.nid===egoNid ? "I. Iacopini" : d.name;
    return nm.length > 18 ? nm.slice(0,17)+"…" : nm;
  });

sim.on("tick", () => {
  const ego = nodes.find(n => n.nid===egoNid);
  ego.fx = W/2; ego.fy = H/2;
  linkSel
    .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  nodeSel.attr("transform", d => `translate(${d.x},${d.y})`);
});

// ─── Panel ──────────────────────────────────────────────────────────
function showPanel(d) {
  const setBadge = cluster => {
    const cl = CLUSTERS[cluster], pb = document.getElementById("pb");
    pb.style.cssText = `display:inline-block;background:${d3.color(cl.color).darker(1.5)};color:${cl.color};border:1px solid ${cl.color}`;
    pb.textContent = cl.label;
  };

  if (d.nid === egoNid) {
    document.getElementById("pt").textContent   = "I. Iacopini";
    document.getElementById("ps").textContent   = "Ego node · all papers";
    document.getElementById("pb").style.display = "none";
    document.getElementById("pc").textContent   = PAPERS.length;
    document.getElementById("pcl").textContent  = "publications";
    document.getElementById("pn").innerHTML     = PAPERS.map(p =>
      `<div class="paper-item">${p.title} <span>(${p.year})</span></div>`
    ).join("");
  } else if (d.type === 'paper') {
    document.getElementById("pt").textContent  = d.title;
    document.getElementById("ps").textContent  = `${d.year} · ${d.authors.length} authors`;
    setBadge(d.cluster);
    document.getElementById("pc").textContent  = d.authors.length;
    document.getElementById("pcl").textContent = "authors";
    document.getElementById("pn").innerHTML    = d.authors.map(aid => {
      const a = AUTHORS.find(x => x.id === aid);
      if (!a) return '';
      const col = CLUSTERS[a.cluster].color;
      const lbl = aid===egoId
        ? `<strong style="color:#e0eaff">I. Iacopini</strong>`
        : a.name;
      return `<div class="paper-item"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${col};margin-right:5px;vertical-align:middle"></span>${lbl}</div>`;
    }).join("");
  } else {
    const data = coauthorMap[d.id];
    document.getElementById("pt").textContent  = d.name;
    document.getElementById("ps").textContent  = CLUSTERS[d.cluster].label;
    setBadge(d.cluster);
    document.getElementById("pc").textContent  = data.count;
    document.getElementById("pcl").textContent = `paper${data.count>1?'s':''} with Iacopo`;
    document.getElementById("pn").innerHTML    = data.papers.map(p =>
      `<div class="paper-item">${p.title} <span>(${p.year})</span></div>`
    ).join("");
  }

  // Highlight neighbours
  const hi = new Set([egoNid]);
  if (d.nid === egoNid) {
    nodes.forEach(n => hi.add(n.nid));
  } else if (d.type === 'paper') {
    hi.add(d.nid);
    d.authors.forEach(aid => hi.add(`a${aid}`));
  } else {
    hi.add(d.nid);
    coauthorMap[d.id].papers.forEach(p => {
      hi.add(`p${PAPERS.indexOf(p)}`);
      p.authors.forEach(aid => hi.add(`a${aid}`));
    });
  }

  nodeSel.attr("opacity", n => hi.has(n.nid) ? 1 : 0.1);
  linkSel.attr("stroke-opacity", l => {
    const s = l.source.nid, t = l.target.nid;
    return hi.has(s) && hi.has(t) ? (l.lt==='ep' ? 0.35 : 0.85) : 0.03;
  });
  document.getElementById("panel").classList.add("on");
}

document.getElementById("xbtn").addEventListener("click", () => {
  document.getElementById("panel").classList.remove("on");
  nodeSel.attr("opacity", 1);
  linkSel.attr("stroke-opacity", l => l.lt==='ep' ? 0.12 : 0.35);
});
</script>
</body>
</html>
